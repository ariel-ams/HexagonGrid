<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honeycomb Wayfinder</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #18201c;
            --panel: #232c27;
            --line: #4f6257;
            --text: #f3f0df;
            --muted: #b8c2aa;
            --accent: #f5c84b;
            --danger: #e76f51;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: grid;
            background:
                radial-gradient(circle at 20% 15%, rgba(245, 200, 75, 0.18), transparent 28rem),
                linear-gradient(135deg, #111613, var(--bg));
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        .shell {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: grid;
            grid-template-columns: 260px minmax(0, 1fr) 320px;
            gap: 16px;
            padding: 16px;
            overflow: hidden;
        }

        .board-wrap {
            position: relative;
            min-width: 0;
            min-height: 0;
            border: 1px solid rgba(243, 240, 223, 0.16);
            background: #16211c;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .side-panel {
            min-width: 0;
            min-height: 0;
            border: 1px solid rgba(243, 240, 223, 0.16);
            background: rgba(35, 44, 39, 0.92);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        h1,
        h2,
        p {
            margin: 0;
        }

        h1 {
            font-size: 24px;
            line-height: 1.1;
        }

        h2 {
            font-size: 14px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0;
        }

        .stats {
            display: grid;
            gap: 10px;
        }

        .stat {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 44px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(243, 240, 223, 0.1);
            color: var(--muted);
        }

        .stat strong {
            color: var(--text);
            font-size: 22px;
        }

        .stat span {
            display: grid;
            gap: 3px;
        }

        .stat small {
            color: rgba(184, 194, 170, 0.7);
            font-size: 12px;
        }

        .cooldown {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.18);
            border: 1px solid rgba(243, 240, 223, 0.12);
        }

        .sting-icon {
            width: 48px;
            height: 48px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: conic-gradient(var(--accent) var(--cooldown-progress, 100%), rgba(243, 240, 223, 0.16) 0);
            position: relative;
        }

        .sting-icon::before {
            content: "";
            position: absolute;
            inset: 5px;
            border-radius: 50%;
            background: #1b251f;
        }

        .sting-icon::after {
            content: "";
            position: relative;
            width: 24px;
            height: 24px;
            background: var(--text);
            clip-path: polygon(50% 0, 64% 38%, 100% 38%, 70% 58%, 82% 100%, 50% 72%, 18% 100%, 30% 58%, 0 38%, 36% 38%);
        }

        .cooldown.ready .sting-icon {
            box-shadow: 0 0 18px rgba(245, 200, 75, 0.36);
        }

        .cooldown-copy {
            display: grid;
            gap: 3px;
            min-width: 0;
        }

        .cooldown-copy strong {
            color: var(--text);
        }

        .cooldown-copy small {
            color: var(--muted);
        }

        .log-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.18);
            border: 1px solid rgba(243, 240, 223, 0.12);
            color: var(--muted);
            line-height: 1.45;
        }

        .log-entry {
            padding: 9px 10px;
            background: rgba(243, 240, 223, 0.06);
            border-left: 3px solid rgba(245, 200, 75, 0.7);
            font-size: 14px;
        }

        .log-entry strong {
            display: block;
            color: var(--text);
            font-size: 12px;
            margin-bottom: 2px;
        }

        button {
            min-height: 42px;
            border: 0;
            background: var(--accent);
            color: #211a06;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.06);
        }

        .end-screen {
            position: fixed;
            inset: 0;
            display: none;
            place-items: center;
            padding: 24px;
            background: rgba(10, 14, 12, 0.78);
            z-index: 5;
        }

        .start-screen {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 50% 30%, rgba(245, 200, 75, 0.18), transparent 28rem),
                rgba(10, 14, 12, 0.9);
            z-index: 6;
        }

        .start-screen.hidden {
            display: none;
        }

        .end-screen.visible {
            display: grid;
        }

        .end-panel,
        .start-panel {
            width: min(420px, 100%);
            border: 1px solid rgba(243, 240, 223, 0.18);
            background: #202a24;
            padding: 24px;
            display: grid;
            gap: 18px;
        }

        .end-panel h2,
        .start-panel h2 {
            font-size: 24px;
            text-transform: none;
        }

        .end-stats {
            display: grid;
            gap: 10px;
        }

        .end-stats div {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            color: var(--muted);
        }

        .end-stats strong {
            color: var(--text);
        }

        @media (max-width: 980px) {
            .shell {
                grid-template-columns: 180px minmax(0, 1fr) 220px;
                gap: 10px;
                padding: 10px;
            }

            .side-panel {
                padding: 12px;
            }

            h1 {
                font-size: 19px;
            }

            .stat strong {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <aside class="side-panel">
            <div>
                <h1>Honeycomb Wayfinder</h1>
                <p id="turnText">Choose a highlighted neighboring cell.</p>
            </div>

            <section>
                <h2>Bee Stats</h2>
                <div class="stats" id="stats"></div>
            </section>

            <section class="cooldown ready" id="cooldownWidget">
                <div class="sting-icon" aria-hidden="true"></div>
                <div class="cooldown-copy">
                    <strong id="cooldownText">Sting ready</strong>
                    <small id="cooldownHint">Attack a wasp or bat</small>
                </div>
            </section>

            <button id="restartButton" type="button">Restart Draft</button>
        </aside>

        <section class="board-wrap" aria-label="Hexagonal game board">
            <canvas id="gameCanvas"></canvas>
        </section>

        <aside class="side-panel">
            <h2>Game Log</h2>
            <div class="log-list" id="logList" aria-live="polite"></div>
        </aside>
    </main>

    <section class="start-screen" id="startScreen" aria-live="polite">
        <div class="start-panel">
            <h2>Honeycomb Wayfinder</h2>
            <p>Start a dungeon run or jump straight into the final dance test.</p>
            <button id="newRunButton" type="button">New Run</button>
            <button id="testDanceButton" type="button">Test Dance</button>
        </div>
    </section>

    <section class="end-screen" id="endScreen" aria-live="polite">
        <div class="end-panel">
            <h2>Run Complete</h2>
            <p>The bee found the final exit.</p>
            <div class="end-stats" id="endStats"></div>
            <button id="endRestartButton" type="button">Start New Run</button>
        </div>
    </section>

    <script src="index.js"></script>
</body>
</html>
